# goreleaser config for bmcctl.
#
# Triggered by `.github/workflows/release.yml` on `git push origin vX.Y.Z`:
#   1. Cross-compiles `cmd/bmcctl` for darwin/linux/windows × amd64/arm64 (+ linux/armv7).
#   2. Tarballs each binary with LICENSE + README.md alongside.
#   3. Computes checksums.txt over all archives.
#   4. Creates the GitHub release with all artifacts attached.
#   5. Renders Casks/bmcctl.rb pointing at the per-platform tarballs and
#      pushes it to j4y-w4lk3r/homebrew-bmcctl (auth via HOMEBREW_TAP_GITHUB_TOKEN).
#   6. Renders bmcctl-bin AUR PKGBUILD + .SRCINFO and pushes to
#      ssh://aur@aur.archlinux.org/bmcctl-bin.git (auth via AUR_SSH_PRIVATE_KEY).
#
# Local dry-run (no publish, builds in dist/):
#   goreleaser release --snapshot --clean
# Local single-arch build (fastest sanity check):
#   goreleaser build --snapshot --clean --single-target

version: 2

project_name: bmcctl

before:
  hooks:
    - go mod tidy

builds:
  - id: bmcctl
    main: ./cmd/bmcctl
    binary: bmcctl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      # Pi 2/3, most Cortex-A SBCs. v6 (Pi 1, Pi Zero) too rare to bother.
      - "7"
    ignore:
      # darwin/arm doesn't exist (Apple is arm64-only).
      - goos: darwin
        goarch: arm
      # Skip 32-bit + 64-bit Windows ARM (audience essentially zero today).
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: bmcctl
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Format examples:
    #   bmcctl_0.1.0_Darwin_arm64.tar.gz
    #   bmcctl_0.1.0_Linux_armv7.tar.gz
    #   bmcctl_0.1.0_Windows_x86_64.zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if and (eq .Arch "arm") (eq .Arm "7") }}armv7
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'merge conflict'
      - '(?i)^typo'

# Auto-publishes a Homebrew Cask to j4y-w4lk3r/homebrew-bmcctl. Requires
# repo secret HOMEBREW_TAP_GITHUB_TOKEN (fine-grained PAT with
# Contents:read+write on j4y-w4lk3r/homebrew-bmcctl).
#
# Cask vs Formula: same logic as fsvc. goreleaser deprecated `brews:` in
# v2.16, and Cask is the right packaging mode for prebuilt binaries
# anyway. Tap repo lives under `Casks/`. Install:
#   brew install --cask j4y-w4lk3r/bmcctl/bmcctl
#
# IMPORTANT — quarantine bit: macOS Gatekeeper sets `com.apple.quarantine`
# on every binary downloaded by Homebrew. bmcctl is not notarized
# (Apple developer fee not justified for a personal CLI), so the
# post-install hook strips the bit so the binary actually runs.
# See https://goreleaser.com/customization/homebrew_casks/.
homebrew_casks:
  - name: bmcctl
    binaries:
      - bmcctl
    repository:
      owner: j4y-w4lk3r
      name: homebrew-bmcctl
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/j4y-w4lk3r/bmcctl"
    description: "AMI MegaRAC CLI for ASRock Rack BMCs: discover, provision, power, sensors, FRU, KVM — Redfish + 1Password."
    commit_author:
      name: bmcctl-release-bot
      email: bmcctl-release-bot@users.noreply.github.com
    commit_msg_template: "bmcctl: bump to {{ .Tag }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bmcctl"]
          end

# Auto-publishes the AUR package `bmcctl-bin` to aur.archlinux.org on every
# release. Pulls the linux/amd64 archive that the builds:/archives:
# stages already produce, generates a PKGBUILD + .SRCINFO referencing it
# by URL+SHA256, and pushes via SSH using the AUR_SSH_PRIVATE_KEY secret.
aurs:
  - name: bmcctl-bin
    homepage: "https://github.com/j4y-w4lk3r/bmcctl"
    description: "AMI MegaRAC CLI for ASRock Rack BMCs: Redfish + 1Password."
    maintainers:
      - "j4y <j4y_w4lk3r@pobox.com>"
    license: "MIT"
    private_key: '{{ .Env.AUR_SSH_PRIVATE_KEY }}'
    git_url: "ssh://aur@aur.archlinux.org/bmcctl-bin.git"
    skip_upload: false
    provides:
      - bmcctl
    conflicts:
      - bmcctl
      - bmcctl-git
    depends:
      - glibc
    optdepends:
      - 'ipmitool: required for `bmcctl fru` and `bmcctl mc` (everything else uses Redfish)'
      - '1password-cli: required for credential storage and retrieval (the `op` binary)'
    commit_author:
      name: bmcctl-release-bot
      email: bmcctl-release-bot@users.noreply.github.com
    commit_msg_template: "bmcctl-bin: bump to {{ .Tag }}"
    package: |-
      install -Dm755 "./bmcctl" "${pkgdir}/usr/bin/bmcctl"

      install -Dm644 "./LICENSE"   "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/${pkgname}/README.md"
