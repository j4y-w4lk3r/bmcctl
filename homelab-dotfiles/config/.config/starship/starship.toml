# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Increase timeout for slow commands (in milliseconds)
command_timeout = 2000  # 2 seconds instead of the default 500ms

# Custom format - controls which modules are shown and in what order
format = """
$fill
$directory\
${custom.sep}\
$hostname\
${custom.git_owner_lso0}${custom.git_owner_j4y}${custom.git_owner_other}\
${custom.git_branch}\
${custom.git_clean}\
${custom.git_dirty_icon}\
$git_status\
$cmd_duration\
$line_break\
$character
"""

right_format = """"""

# Add a blank line before each prompt
add_newline = false

[fill]
symbol = "─"
style = "dim white"

# Prompt marker (simple, not a chevron/arrow)
[character]
success_symbol = "[●](bold green)"
error_symbol = "[✗](bold red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[time]
disabled = true

# Show Git information more concisely
[git_branch]
disabled = true

[git_commit]
commit_hash_length = 8
style = "bold white"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_status]
conflicted = "✖"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
up_to_date = ""
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
style = "bold yellow"
format = "([($all_status$ahead_behind)]($style) )"

[custom.sep]
command = "printf '|'"
format = " [$output](238) "
style = "238"

[custom.git_owner_lso0]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && url=$(git remote get-url origin 2>/dev/null) && owner="" && case "$url" in git@github.com:*/*|*github.com/*/*) url="${url%.git}"; case "$url" in git@github.com:*) rest="${url#git@github.com:}" ;; *) rest="${url#*github.com/}"; rest="${rest#*:}" ;; esac; owner="${rest%%/*}" ;; esac && [ "$owner" = "lso0" ]'
command = 'printf lso0'
symbol = " "
format = " [|(238)](238) [$symbol$output]($style) "
style = "bold yellow"

[custom.git_owner_j4y]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && url=$(git remote get-url origin 2>/dev/null) && owner="" && case "$url" in git@github.com:*/*|*github.com/*/*) url="${url%.git}"; case "$url" in git@github.com:*) rest="${url#git@github.com:}" ;; *) rest="${url#*github.com/}"; rest="${rest#*:}" ;; esac; owner="${rest%%/*}" ;; esac && [ "$owner" = "j4y-w4lk3r" ]'
command = 'printf j4y-w4lk3r'
symbol = " "
format = " [|(238)](238) [$symbol$output]($style) "
style = "bold 205"

[custom.git_owner_other]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && url=$(git remote get-url origin 2>/dev/null) && owner="" && case "$url" in git@github.com:*/*|*github.com/*/*) url="${url%.git}"; case "$url" in git@github.com:*) rest="${url#git@github.com:}" ;; *) rest="${url#*github.com/}"; rest="${rest#*:}" ;; esac; owner="${rest%%/*}" ;; esac && [ -n "$owner" ] && [ "$owner" != "lso0" ] && [ "$owner" != "j4y-w4lk3r" ]'
command = '''
url=$(git remote get-url origin 2>/dev/null)
owner=""
case "$url" in
  git@github.com:*/*|*github.com/*/*)
    url="${url%.git}"
    case "$url" in
      git@github.com:*) rest="${url#git@github.com:}" ;;
      *) rest="${url#*github.com/}"; rest="${rest#*:}" ;;
    esac
    owner="${rest%%/*}"
    ;;
esac
[ -n "$owner" ] && printf '%s' "$owner"
'''
symbol = " "
format = " [|(238)](238) [$symbol$output]($style) "
style = "bold purple"

[custom.git_branch]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = 'git branch --show-current 2>/dev/null'
symbol = " "
format = " [|(238)](238) [$symbol$output]($style) "
style = "bold 213"

[custom.git_clean]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && [ -z "$(git status --porcelain 2>/dev/null)" ] && { counts="$(git rev-list --left-right --count @{upstream}...HEAD 2>/dev/null)" || exit 0; [ "$(echo "$counts" | awk "{print \$1+\$2}")" = 0 ]; }'
command = "printf '\\xef\\x81\\x98 '"
format = " [|(238)](238) [$output]($style) "
style = "bold green"

[custom.git_dirty_icon]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && { [ -n "$(git status --porcelain 2>/dev/null)" ] && exit 0; counts="$(git rev-list --left-right --count @{upstream}...HEAD 2>/dev/null)" || exit 1; [ "$(echo "$counts" | awk "{print \$1+\$2}")" != 0 ]; }'
command = "printf '\\xef\\x81\\x84 '"
format = " [|(238)](238) [$output]($style) "
style = "bold red"

# Show current directory
[directory]
truncation_length = 5
truncate_to_repo = true
style = "bold cyan"

[hostname]
ssh_only = false
trim_at = "."
format = "[@$hostname]($style) "
style = "dim white"

# Show language versions
[python]
disabled = true
symbol = " "
style = "dimmed white"
format = '[${symbol}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
disabled = true
symbol = "⬢ "
format = "[$symbol($version )]($style)"

[ruby]
disabled = true
symbol = " "
style = "dimmed white"
format = "[$symbol($version )]($style)"

[rust]
disabled = true
symbol = " "
style = "dimmed white"
format = "[$symbol($version )]($style)"

[java]
disabled = true
symbol = " "
style = "dimmed white"
format = "[$symbol($version )]($style)"

[golang]
disabled = true
symbol = " "
style = "dimmed white"
format = "[$symbol($version )]($style)"

# Command execution time
[cmd_duration]
min_time = 2000
format = "󰔟 [$duration](dimmed yellow)"

[battery]
disabled = true

# Show shell indicator
[shell]
disabled = false
bash_indicator = "bash"
zsh_indicator = "zsh"
fish_indicator = "fish"
format = "[$indicator]($style) "

# Make the prompt more compact by moving parts to the right
[aws]
disabled = true
symbol = "  "

[gcloud]
disabled = true
format = 'on [$symbol$active]($style) '

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[php]
symbol = " "
