# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Increase timeout for slow commands (in milliseconds)
command_timeout = 2000  # 2 seconds instead of the default 500ms

# Custom format - controls which modules are shown and in what order
format = """
$fill
$directory\
$hostname\
$git_branch\
$git_status\
$custom\
$python\
$golang\
$rust\
$java\
$ruby\
$cmd_duration\
$line_break\
$character
"""

right_format = """"""

# Add a blank line before each prompt
add_newline = false

[fill]
symbol = "─"
style = "dim white"

# Prompt marker (simple, not a chevron/arrow)
[character]
success_symbol = "[●](bold green)"
error_symbol = "[✗](bold red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[time]
disabled = true

# Show Git information more concisely
[git_branch]
symbol = " "
truncation_length = 20
format = "[$symbol$branch(:$remote_name/$remote_branch)]($style) "
always_show_remote = true
ignore_branches = ["main"]

[git_commit]
commit_hash_length = 8
style = "bold white"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_status]
# Simplified format with fewer symbols
conflicted = "✖"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
up_to_date = "✓"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
style = "bright-white"
format = "([($all_status$ahead_behind)]($style) )"  # Restore the format to show Git status

[custom.git_upstream]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = 'git rev-parse --abbrev-ref --symbolic-full-name @{u} 2>/dev/null || echo no-upstream'
format = "([$output]($style) )"
style = "dimmed"

# Show current directory
[directory]
truncation_length = 5
truncate_to_repo = true
style = "bold cyan"

[hostname]
ssh_only = false
trim_at = "."
format = "[@$hostname]($style) "
style = "dim white"

# Show language versions
[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
disabled = true
symbol = "⬢ "
format = "[$symbol($version )]($style)"

[ruby]
symbol = " "
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"

[java]
symbol = " "
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"

# Command execution time
[cmd_duration]
min_time = 2000
format = "󰔟 [$duration](bold yellow)"

[battery]
disabled = true

# Show shell indicator
[shell]
disabled = false
bash_indicator = "bash"
zsh_indicator = "zsh"
fish_indicator = "fish"
format = "[$indicator]($style) "

# Make the prompt more compact by moving parts to the right
[aws]
disabled = true
symbol = "  "

[gcloud]
disabled = true
format = 'on [$symbol$active]($style) '

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[php]
symbol = " " 