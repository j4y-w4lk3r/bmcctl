# tmux configuration file

# Non-login shells — skip .zprofile on every new pane (~3s faster)
set -g default-command "exec zsh"

# Change the default prefix from Ctrl+b to Ctrl+F4 (avoids conflicts with Ctrl+a in applications like Yazi)
unbind C-b
set-option -g prefix C-F4
bind-key C-F4 send-prefix

# Enable mouse support (scrolling, selecting panes, resizing panes)
set -g mouse on

# Start window numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Better split pane shortcuts
# Use | for vertical splits and - for horizontal splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Set vi mode for better navigation
setw -g mode-keys vi

# Use vi-like keys for copy mode navigation
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Catppuccin theme configuration - Ultra-minimal design
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "none"

# Custom minimal window styling using pure tmux
# Numbers only without circles - bypassing Catppuccin
set -g window-status-format " #I "
set -g window-status-current-format " #I "
set -g window-status-separator ""

# Window colors using Catppuccin theme colors
set -g window-status-style "fg=#6c7086,bg=default"
set -g window-status-current-style "fg=#cba6f7,bg=default,bold"

# Old status bar styling (disabled in favor of Catppuccin)
# set -g status-style bg=black,fg=white
# set -g window-status-current-style bg=blue,fg=white,bold

# Set status bar components (disabled in favor of Catppuccin)
# set -g status-left-length 40
# set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
# set -g status-right "#[fg=cyan]%d %b %R"

# Increase history limit
set -g history-limit 10000

# Set the default terminal mode to 256color mode
# Set the default terminal mode to xterm-256color for better Warp compatibility
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[6 q'

# Warp Terminal specific settings
set -ga terminal-overrides ",WarpTerminal:Tc"
set -as terminal-features ",WarpTerminal:RGB"

# Enable escape sequence passthrough for Warp blocks functionality
set -g allow-passthrough on

# Allow OSC sequences specifically needed by Warp blocks
set -ga terminal-features "*:osc7"
set -ga terminal-features "*:osc8"
set -ga terminal-features "*:osc52"
set -ga terminal-features "*:osc104"
set -ga terminal-features "*:osc633"  # Likely used by Warp blocks
set -ga terminal-features "*:osc760"  # Likely used by Warp blocks
set -ga terminal-features "*:osc761"  # Likely used by Warp blocks

# Ensure terminal environment variables are passed through
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment WARP_IS_LOCAL_SHELL

# Address vim mode switching delay
set -s escape-time 0

# Reload tmux config with 'r'
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config"

# Kill pane without confirmation (override default x binding)
unbind x
bind-key x kill-pane

# Kill session without confirmation
bind-key k kill-session

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'alvinunreal/tmuxai'
set -g @plugin 'catppuccin/tmux'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Status line configuration (must come after plugin loading)
set -g status-style "bg=#24273a,fg=#cdd6f4"
set -g status-border on
set -g status-border-style "fg=#494d64,dim"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#cba6f7,bold] #S  "
#
# Pomodoro indicator (defaults to 0/30). Uses a Nerd Font clock icon.
# Update it anytime with: tmux set -g @pomo "10/30"
set -g @pomo "0/30"
set -g status-right "#[fg=#6c7086] %H:%M | #{@pomo} 󰥔"

# Quick edit Pomodoro counter (prefix + P)
bind-key P command-prompt -p "Pomodoro (e.g. 10/30)" "set -g @pomo '%%' \\; refresh-client -S"

